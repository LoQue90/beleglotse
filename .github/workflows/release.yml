name: Windows release
on:
  push:
    branches: [main]
    paths: [VERSION, '.github/workflows/release.yml', 'scripts/build_exe.py']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: beleglotse-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Test application
        run: python -m unittest discover -s tests -v
      - name: Resolve release version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw 'Git tag and VERSION do not match.'
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build verified release packages
        run: python scripts/build_release.py --tag "$env:RELEASE_TAG"
      - name: Install EXE build tools
        run: python -m pip install pyinstaller==6.20.0
      - name: Build and test Windows EXE
        run: python scripts/build_exe.py
      - name: Create release and upload files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $existingTag = git tag --list "$env:RELEASE_TAG"
          if ($existingTag) {
            $tagCommit = git rev-list -n 1 "$env:RELEASE_TAG"
            if ($tagCommit -ne $env:GITHUB_SHA) { throw 'Existing version tag points to another commit. Increase VERSION.' }
          }
          gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "BelegLotse $env:RELEASE_TAG" --generate-notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $releaseFiles = Get-ChildItem -Path dist -File | ForEach-Object { $_.FullName }
          gh release upload "$env:RELEASE_TAG" @releaseFiles --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
